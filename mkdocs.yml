site_name: Laboratorio di Ricerca Operativa · Fabio Furini
site_description: >-
  Modelli continui di ottimizzazione per l'Ingegneria Gestionale:
  dispensa, codice Python/Gurobi, dati e casi di studio.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/laboratorio-ricerca-operativa
copyright: >-
  &copy; 2026 Fabio Furini — testi, figure e dati con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice Python con licenza
  <a href="https://github.com/fabiofurini/laboratorio-ricerca-operativa/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/chart-timeline-variant
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
  - redirects:
      redirect_maps:
        richiami.md: teoria-lp.md
        guida-gurobi.md: solver-lp.md

extra:
  social:
    - icon: material/web
      link: https://sites.google.com/view/fabiofurini/home-page
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/laboratorio-ricerca-operativa/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/operations-research-lab/
      lang: en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Strumenti:
      - strumenti.md
      - Teoria, programmazione lineare: teoria-lp.md
      - Teoria, ottimizzazione non lineare: teoria-non-lineare.md
      - Solver, modelli lineari: solver-lp.md
      - Solver, modelli non lineari: solver-non-lineare.md
      - Notebook in Colab: notebook.md
  - Modelli deterministici:
      - modelli-deterministici.md
      - Produzione e scorte: produzione.md
      - Supply chain e CO2: supplychain.md
      - Portafoglio di Markowitz: markowitz.md
      - Pricing e revenue management: pricing.md
      - Budget pubblicitario: budget.md
      - Localizzazione continua: localizzazione.md
      - Ricarica di veicoli elettrici: ricarica-ev.md
      - Code e capacità di servizio: code.md
  - Decisioni sotto incertezza:
      - decisioni-incertezza.md
      - Il Newsvendor: newsvendor.md
      - VaR e CVaR: var-cvar.md
      - Arbitraggio e prezzatura: arbitraggio.md
  - Ottimizzazione e machine learning:
      - ottimizzazione-ml.md
      - Support Vector Machine: svm.md
      - Regressione robusta e quantile: regressione.md
  - Organizzazione del laboratorio: organizzazione.md
