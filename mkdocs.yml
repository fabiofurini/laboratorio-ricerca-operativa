site_name: Laboratorio di Ricerca Operativa
site_description: >-
  Modelli continui di ottimizzazione per l'Ingegneria Gestionale:
  dispensa, codice Python/Gurobi, dati e casi di studio.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/laboratorio-ricerca-operativa

theme:
  name: material
  language: it
  icon:
    logo: material/chart-timeline-variant
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
  - redirects:
      redirect_maps:
        richiami.md: teoria-lp.md
        guida-gurobi.md: solver-lp.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Strumenti:
      - Teoria, programmazione lineare: teoria-lp.md
      - Teoria, ottimizzazione non lineare: teoria-non-lineare.md
      - Solver, modelli lineari: solver-lp.md
      - Solver, modelli non lineari: solver-non-lineare.md
  - Modelli deterministici:
      - Produzione e scorte: produzione.md
      - Supply chain e CO2: supplychain.md
      - Portafoglio di Markowitz: markowitz.md
      - Pricing e revenue management: pricing.md
      - Budget pubblicitario: budget.md
      - Localizzazione continua: localizzazione.md
      - Ricarica di veicoli elettrici: ricarica-ev.md
      - Code e capacità di servizio: code.md
  - Decisioni sotto incertezza:
      - Il Newsvendor: newsvendor.md
      - VaR e CVaR: var-cvar.md
  - Ottimizzazione e machine learning:
      - Support Vector Machine: svm.md
  - Organizzazione del laboratorio: organizzazione.md
